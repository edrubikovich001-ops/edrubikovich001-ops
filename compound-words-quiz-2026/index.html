<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#10152a"/><title>Compound Words | Quiz</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#263a72 0,transparent 40%),radial-gradient(circle at 90% 90%,#482367 0,transparent 45%),#0c1020;color:white;font:16px system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.wrap{width:100%;max-width:670px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;font-weight:850;letter-spacing:.07em}.top b{color:#5bcfff}.tag{border:1px solid #ffffff45;padding:9px 12px;border-radius:30px;font-size:11px}.panel{background:linear-gradient(145deg,#212c4f,#151c32);border:1px solid #ffffff29;border-radius:28px;box-shadow:0 25px 60px #0006;padding:clamp(22px,5vw,45px);min-height:470px}.label{font-size:12px;color:#54d1ff;text-transform:uppercase;letter-spacing:.16em;font-weight:900}.big{font-size:clamp(44px,9vw,70px);line-height:1.03;margin:16px 0 22px;font-weight:950}.shine{background:linear-gradient(90deg,#56d9ff,#af95ff,#ff9cce);color:transparent;background-clip:text}h2{font-size:clamp(25px,5vw,34px);line-height:1.17;margin:18px 0 24px}.desc{color:#bdc7e4;font-size:16px;line-height:1.6}.pills{display:flex;flex-wrap:wrap;gap:8px;margin:27px 0}.pill{font-size:13px;background:#ffffff18;border-radius:25px;padding:9px 13px;font-weight:700}.btn{border:none;background:linear-gradient(90deg,#43c9ff,#a987ff);font-weight:900;padding:16px 24px;min-height:52px;border-radius:16px;color:#10152a;font-size:16px;cursor:pointer}.btn:active{transform:scale(.98)}.secondary{border:1px solid #ffffff43;background:#ffffff14;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:850;color:#bdc7e4;margin-bottom:13px}.track{height:8px;border-radius:99px;background:#ffffff20;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#39c6ff,#ae8cff);transition:width .25s}.line{display:flex;justify-content:space-between;gap:10px;color:#bdc7e4;font-size:13px;margin:25px 0 0}.time{color:#ffe28d;font-weight:900}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:2px solid #ffffff18;background:#2b3657;color:white;min-height:75px;display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:16px;font-size:16px;font-weight:750;cursor:pointer}.opt:hover:not(:disabled){border-color:#a0c2ff}.opt b{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:9px;background:#ffffff1a}.opt:disabled{cursor:default}.opt.good{background:#135b49;border-color:#34e3ad}.opt.bad{background:#6e2c4a;border-color:#ff7096}.notice{margin-top:19px;border:1px solid #ffffff27;border-radius:16px;background:#ffffff15;padding:16px;line-height:1.5}.notice strong{font-size:17px}.score{font-size:clamp(85px,20vw,130px);font-weight:950;margin:0;line-height:1.1}.score small{font-size:.28em;color:#aeb9d5}.foot{font-size:12px;color:#8794b8;text-align:center;margin:20px}.conf{position:fixed;top:-30px;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}@media(max-width:550px){body{padding:12px}.panel{border-radius:21px;min-height:500px}.options{grid-template-columns:1fr;gap:10px}.opt{min-height:60px;padding:12px}.actions{flex-direction:column}.btn{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap"><div class="top"><span>⚡ WORD<b>SPARK</b></span><span class="tag">🇬🇧 ENGLISH QUIZ</span></div><main class="panel" id="app"></main><div class="foot">7 questions · 4 options · Instant feedback · Share with friends</div></div><script>
const q=[
["Which word is a compound word?",["Beautiful","Sunflower","Quickly","Happy"],1,"Sun + flower = sunflower (подсолнух)."],
["Choose the correct compound word: tooth + brush",["Tooth brush","Tooth-brush","Toothbrush","Brush tooth"],2,"Tooth + brush = toothbrush (зубная щётка)."],
["What does 'raincoat' mean?",["Sunglasses","Umbrella","A coat for rainy weather","Shoes"],2,"Rain + coat = raincoat (дождевик)."],
["Which compound word is written with a hyphen?",["Bedroom","Mother-in-law","Football","Notebook"],1,"Mother-in-law (тёща или свекровь) пишется через дефисы."],
["Complete the word: class + ___",["Work","Room","Book","Time"],1,"Class + room = classroom (классная комната)."],
["Which is an open compound word?",["Ice cream","Basketball","Sunlight","Airport"],0,"Ice cream (мороженое) пишется раздельно."],
["What is 'basketball' made of?",["Base + ball","Basket + ball","Back + ball","Best + ball"],1,"Basket + ball = basketball (баскетбол)."]
];let i=0,score=0,locked=false,timer=null,left=20;const el=document.getElementById('app');function intro(){clearInterval(timer);el.innerHTML='<div style="font-size:65px">🧩</div><div class="label">English Vocabulary Challenge</div><div class="big">COMPOUND<br><span class="shine">WORDS</span></div><p class="desc">Готов проверить свой английский? Выбирай правильные ответы и сразу узнавай результат!</p><div class="pills"><span class="pill">🎯 7 вопросов</span><span class="pill">⏱ 20 секунд</span><span class="pill">🏆 Баллы</span><span class="pill">⚡ Без регистрации</span></div><div class="actions"><button class="btn" onclick="start()">🚀 Начать игру</button><button class="btn secondary" onclick="share()">🔗 Поделиться</button></div>'}
function start(){i=0;score=0;question()}function question(){clearInterval(timer);locked=false;left=20;let a=q[i];el.innerHTML='<div class="meta"><span>ВОПРОС '+(i+1)+' / 7</span><span>⭐ '+score+' баллов</span></div><div class="track"><div class="fill" style="width:'+(i/7*100)+'%"></div></div><div class="line"><span>Выбери правильный вариант</span><span class="time" id="time">⏱ 20 сек</span></div><h2>'+a[0]+'</h2><div class="options">'+a[1].map((s,j)=>'<button class="opt" data-i="'+j+'"><b>'+String.fromCharCode(65+j)+'</b>'+s+'</button>').join('')+'</div><div id="feedback"></div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));timer=setInterval(()=>{left--;let t=document.getElementById('time');if(t)t.textContent='⏱ '+left+' сек';if(left<=0)choose(-1)},1000)}
function choose(x){if(locked)return;locked=true;clearInterval(timer);let a=q[i],ok=x===a[2];if(ok)score++;document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('good');else if(j===x)b.classList.add('bad')});document.getElementById('feedback').innerHTML='<div class="notice"><strong>'+(ok?'✅ Верно!':x===-1?'⏰ Время вышло!':'❌ Не совсем!')+'</strong><div style="margin-top:5px">'+a[3]+'</div></div><div class="actions"><button class="btn" id="next">'+(i===6?'🏆 Мой результат':'Следующий вопрос →')+'</button></div>';document.getElementById('next').onclick=()=>{i++;if(i===7)finish();else question()}}
function finish(){clearInterval(timer);let p=Math.round(score/7*100);el.innerHTML='<div class="label">Quiz complete!</div><h2>Твой результат</h2><div style="font-size:64px">'+(score>=6?'🏆':score>=4?'🥈':'🌟')+'</div><div class="score shine">'+score+'<small> / 7</small></div><h2>'+(score===7?'Perfect! Word master!':score>=5?'Great job!':score>=3?'Good try!':'Keep practicing!')+'</h2><p class="desc">Правильных ответов: '+score+' из 7 ('+p+'%). Попробуй снова или отправь результат в группу!</p><div class="actions"><button class="btn" onclick="start()">🔁 Ещё раз</button><button class="btn secondary" onclick="share(true)">📤 Поделиться результатом</button></div>';if(score>=5&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let k=0;k<22;k++){let s=document.createElement('span');s.className='conf';s.textContent=['🎉','✨','⭐'][k%3];s.style.left=(Math.random()*95)+'%';s.style.animationDelay=Math.random()+'s';document.body.append(s);setTimeout(()=>s.remove(),4000)}}}
async function share(result){let text=result?'🧩 Compound Words Quiz: я набрал(а) '+score+'/7! А ты? '+location.href:'🧩 Пройди Compound Words Quiz! 7 вопросов, мгновенная проверка. '+location.href;try{if(navigator.share)await navigator.share({title:'Compound Words Quiz',text:text});else{await navigator.clipboard.writeText(text);alert('Ссылка скопирована. Отправь её в группу!')}}catch(e){if(e.name!=='AbortError')prompt('Скопируй ссылку',location.href)}}intro();
</script></body></html>
