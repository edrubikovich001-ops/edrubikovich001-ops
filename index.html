const paras=[];for(const el of root.querySelectorAll('p, .poem, .verse')){if(el.closest('table,nav,.metadata,.headerContainer,.mw-collapsible'))continue;const text=el.textContent.replace(/\[\s*\d+\s*\]/g,'').replace(/\s+/g,' ').trim();if(text.length>32&&(!paras.length||paras.at(-1)!==text))paras.push(text)}return paras}

async function getPage(b,n){const k=`atlas-text-${b.id}-${n}`;const stored=await recordGet(k);if(stored?.paras?.length)return stored.paras;const sec=b.sections[n];if(!sec)throw Error('Глава не найдена');const url=`https://ru.wikisource.org/w/api.php?action=parse&prop=text&format=json&origin=*&page=${encodeURIComponent(sec.page)}`;let obj;try{const resp=await fetch(url,{signal:AbortSignal.timeout(13000)});if(!resp.ok)throw Error(`HTTP ${resp.status}`);obj=await resp.json()}catch(err){const fallback=await fetch(`${proxy}?source=wiki&page=${encodeURIComponent(sec.page)}`,{signal:AbortSignal.timeout(17000)});if(!fallback.ok)throw Error('Викитека сейчас недоступна — проверь интернет');obj=await fallback.json()}
if(obj.error||!obj.parse?.text?.['*'])throw Error('Глава не найдена в оригинальном источнике');const paras=cleanWikitext(obj.parse.text['*']);if(paras.length<2)throw Error('Не удалось достоверно извлечь текст главы');await recordPut({id:k,paras,title:sec.title});return paras}
function splitParas(t){let a=String(t||'').replace(/\r\n/g,'\n').split(/\n\s*\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x.length>8);if(a.length<5)a=t.split('\n').map(x=>x.trim()).filter(x=>x.length>8);let out=[];for(let p of a){if(p.length>1900){for(let i=0;i<p.length;i+=1200)out.push(p.slice(i,i+1200))}else out.push(p)}return out}
function groupChapters(paras){const chapters=[];let cur=[];for(const p of paras){if(cur.length>40 || (cur.length>12 && /^((глава|chapter|book)\s+[\dIVXLCD]+)/i.test(p) )){chapters.push({title:`Раздел ${chapters.length+1}`,paras:cur});cur=[]}cur.push(p)}if(cur.length)chapters.push({title:`Раздел ${chapters.length+1}`,paras:cur});return chapters}
async function getGutenberg(b){const cache=await recordGet(`atlas-full-${b.id}`);if(cache?.chapters?.length)return cache.chapters;const url=`https://www.gutenberg.org/cache/epub/${b.gutenberg}/pg${b.gutenberg}.txt`;let text;try{const res=await fetch(url,{signal:AbortSignal.timeout(14000)});if(!res.ok)throw Error();text=await res.text()}catch(e){const r=await fetch(`${proxy}?source=gutenberg&id=${b.gutenberg}`,{signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('Не удалось загрузить оригинальный текст');text=await r.text()}
if(!text||text.length<2500)throw Error('Оригинал временно недоступен. Попробуй позже.');const chapters=groupChapters(splitParas(text));await recordPut({id:`atlas-full-${b.id}`,chapters});return chapters}
async function loadChapter(n){if(!reader)return;const b=reader;let paragraphs,title,total;if(b.source==='wikisource'){if(n<0||n>=b.sections.length)return;title=b.sections[n].title;total=b.sections.length}else{const c=openBookCache.get(b.id)||[];if(n<0||n>=c.length)return;title=c[n].title;total=c.length}
chapter=n;chapterParas=[];$('#app').innerHTML=readerFrame(b,title,total,`<div class="reader-load"><div class="loading-dot"></div>Открываем настоящий текст из источника…</div>`);try{chapterParas=b.source==='wikisource'?await getPage(b,n):(openBookCache.get(b.id)?.[n]?.paras||[]);if(!reader||reader.id!==b.id)return;renderChapter(b,title,total)}catch(err){const msg=esc(err.message||'Не удалось получить оригинал');$('#readerText').innerHTML=`<div class="reader-load">${msg}<p><button class="btn light" data-reader="retry">Попробовать ещё раз</button></p><p><a target="_blank" rel="noopener" href="${esc(b.source==='wikisource'?`https://ru.wikisource.org/wiki/${encodeURIComponent(b.sections[n]?.page||b.wiki)}`:`https://www.gutenberg.org/ebooks/${b.gutenberg}`)}">Открыть источник ↗</a></p></div>`}}
function readerFrame(b,title,total,content){return `<div class="reader ${state.theme==='night'?'dark':state.theme==='light'?'white':''}" id="reader"><div class="reader-head"><button data-reader="exit" aria-label="Закрыть">←</button><span class="title">${esc(b.title)}</span><button data-reader="settings" aria-label="Настройки">Aa</button><button data-reader="recap" aria-label="Напомнить главу">✦</button></div><div class="reading-area" id="readingArea"><span class="chapter-kicker">Оригинальный текст · ${chapter+1} / ${total}</span><h1>${esc(title)}</h1><div class="reading-body" id="readerText" style="--reader-size:${state.fontSize}px">${content}</div></div><div class="reader-foot"><button data-reader="prev" ${chapter===0?'disabled':''}>← Глава</button><span class="centered">${chapter+1} из ${total}</span><button data-reader="next" ${chapter>=total-1?'disabled':''}>Глава →</button></div></div>`}
function tokenize(str){return esc(str).replace(/([^\p{L}\p{M}]*)([\p{L}\p{M}][\p{L}\p{M}'’\-]*)/gu,(m,pre,term)=>`${pre}<span class="term" data-word="${term}">${term}</span>`)}
function renderChapter(b,title,total){const data=chapterParas.map((p,i)=>`<p data-p="${i}" class="${state.progress[b.id]?.chapter===chapter&&state.progress[b.id]?.para===i?'focus':''}">${tokenize(p)}</p>`).join('');$('#app').innerHTML=readerFrame(b,title,total,data);const saved=state.progress[b.id];if(saved?.chapter===chapter&&saved.para)requestAnimationFrame(()=>$('#readerText [data-p="'+Math.min(saved.para,chapterParas.length-1)+'"]')?.scrollIntoView({block:'start'}));const sc=$('#readingArea');let timeout;sc.addEventListener('scroll',()=>{clearTimeout(timeout);timeout=setTimeout(()=>{const visible=$$('[data-p]',sc);let pos=0;for(let i=0;i<visible.length;i++){if(visible[i].getBoundingClientRect().top<window.innerHeight*.45)pos=i}putProgress(b,chapter,pos,chapterParas.length)},490)},{passive:true});putProgress(b,chapter,saved?.chapter===chapter?saved.para:0,chapterParas.length)}
async function startReader(b){if(loadBusy||!readable(b))return;loadBusy=true;reader=b;screenBeforeReader=screen;try{if(b.source==='gutenberg'){notify('Загружаем текст из Project Gutenberg…');openBookCache.set(b.id,await getGutenberg(b))}else if(b.source==='import'){const r=await recordGet(b.id);if(!r?.chapters)throw Error('Файл отсутствует на этом устройстве');openBookCache.set(b.id,r.chapters)}const last=state.progress[b.id];const n=last?.chapter||0;if(last){modal('Продолжить чтение?',`<p>Ты остановился на ${last.percent||0}% книги. Продолжить с этого места?</p>`,`<button class="btn" data-sheet="continue">Да, продолжить</button><button class="btn outline" data-sheet="restart">Сначала</button>`)}else await loadChapter(0)}catch(e){reader=null;notify(e.message||'Не получилось открыть текст');render()}finally{loadBusy=false}}
function exitReader(){const b=reader;const visible=$$('[data-p]');if(b&&visible.length){let pos=0;for(let i=0;i<visible.length;i++)if(visible[i].getBoundingClientRect().top<window.innerHeight*.42)pos=i;putProgress(b,chapter,pos,chapterParas.length)}reader=null;go('library')}
function recall(){if(!chapterParas.length)return;const subset=chapterParas.slice(0,Math.min(chapterParas.length,180));const samples=[subset[0],subset[Math.floor(subset.length/2)],subset.at(-1)].filter(Boolean).map(s=>s.slice(0,250));const title=reader.source==='wikisource'?reader.sections[chapter].title:(openBookCache.get(reader.id)?.[chapter]?.title||'Раздел');modal('Перед продолжением',`<p><strong>${esc(title)}.</strong> Ниже — точные фрагменты исходного текста, а не выдуманный пересказ.</p>${samples.map(t=>`<div class="excerpt">«${esc(t)}…»</div>`).join('')}<p>Вспомни: что произошло в начале, какая мысль показалась самой важной и с чем ты не согласен?</p>`,`<button class="btn" data-sheet="close">К чтению</button>`)}
function readerSettings(){modal('Настройки чтения',`<p>Выбери удобный размер букв и фон книги.</p><div class="sub-actions"><button data-sheet="smaller">A−</button><strong>${state.fontSize}px</strong><button data-sheet="bigger">A+</button></div><div class="sub-actions" style="margin-top:15px"><button data-sheet="sepia">Тёплый</button><button data-sheet="white">Белый</button><button data-sheet="night">Ночной</button></div><p style="margin-top:18px">Нажми на слово для словаря или на абзац, чтобы запомнить именно это место.</p>`)}
function dictionary(word){const w=word.replace(/[^\p{L}\p{M}'’\-]/gu,'');modal('Значение слова',`<div class="excerpt"><strong>${esc(w)}</strong></div><p id="definition">Ищу проверенное определение в Викисловаре…</p>`,`<a class="btn outline" target="_blank" rel="noopener" href="https://ru.wiktionary.org/wiki/${encodeURIComponent(w)}">Открыть словарь ↗</a><button class="btn" data-sheet="close">Читать дальше</button>`);fetch(`https://ru.wiktionary.org/w/api.php?action=parse&prop=wikitext&format=json&origin=*&page=${encodeURIComponent(w)}`,{signal:AbortSignal.timeout(6000)}).then(r=>r.json()).then(x=>{const text=x.parse?.wikitext?.['*']||'';const lines=text.split('\n').filter(s=>/^#(?![:*#])\s+/.test(s)).slice(0,3).map(s=>s.replace(/^#\s+/,'').replace(/\{\{[^{}]*\}\}/g,'').replace(/\[\[([^\]|]+\|)?([^\]]+)\]\]/g,'$2').replace(/<[^>]*>/g,'').trim()).filter(Boolean);if($('#definition'))$('#definition').textContent=lines.join(' • ').slice(0,600)||'Точного толкования не нашлось. Открой статью в словаре.'}).catch(()=>{if($('#definition'))$('#definition').textContent='Не удалось получить определение. Открой Викисловарь для проверки.'})}
async function importFile(file){if(!file)return;if(file.size>30e6){notify('Файл должен быть меньше 30 МБ');return}notify('Читаем файл…');try{const ext=file.name.split('.').at(-1).toLowerCase();let text='';if(ext==='txt')text=await file.text();else if(ext==='fb2'){const xml=new DOMParser().parseFromString(await file.text(),'text/xml');if(xml.querySelector('parsererror'))throw Error('Неверный FB2');text=[...xml.querySelectorAll('body p,body subtitle,body title')].map(n=>n.textContent.trim()).filter(Boolean).join('\n\n')}else if(ext==='epub'){if(!window.JSZip)await inject('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');const zip=await JSZip.loadAsync(file);const container=zip.file('META-INF/container.xml');if(!container)throw Error('EPUB повреждён');const data=new DOMParser().parseFromString(await container.async('text'),'application/xml');const opf=data.querySelector('rootfile')?.getAttribute('full-path');if(!opf)throw Error('EPUB без содержания');const xml=new DOMParser().parseFromString(await zip.file(opf).async('text'),'application/xml');const manifest={};[...xml.getElementsByTagName('item')].forEach(x=>manifest[x.getAttribute('id')]=x.getAttribute('href'));const spine=[...xml.getElementsByTagName('itemref')].map(x=>x.getAttribute('idref'));const dir=opf.includes('/')?opf.slice(0,opf.lastIndexOf('/')+1):'';let paras=[];for(const ref of spine){const f=zip.file(dir+decodeURIComponent(manifest[ref]||'').replace(/^\.\//,''));if(!f)continue;const h=new DOMParser().parseFromString(await f.async('text'),'text/html');paras.push(...[...h.querySelectorAll('p,h1,h2,h3,li')].map(x=>x.textContent.trim()).filter(Boolean))}text=paras.join('\n\n')}else if(ext==='pdf'){if(!window.pdfjsLib)await inject('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let pages=[];for(let i=1;i<=pdf.numPages;i++)pages.push((await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(' '));text=pages.join('\n\n')}else throw Error('Формат не поддерживается');if(text.trim().length<100)throw Error('В файле не нашёлся текст. Сканированные PDF не поддерживаются.');const chapters=groupChapters(splitParas(text));const id='mine-'+crypto.randomUUID();const meta={id,title:file.name.replace(/\.[^.]+$/,''),author:'Мой файл',category:'Мои книги',lang:'ru',age:12,source:'import',index:96,desc:`Мой полный оригинальный текст: ${file.name}`,chapters:chapters.length};await recordPut({...meta,chapters});customFiles.unshift(meta);notify('Книга готова к чтению');focus=meta;screen='library';render()}catch(e){modal('Не получилось открыть файл',`<p>${esc(e.message||'Попробуй другой файл')}</p>`)}finally{$('#upload').value=''}}
function inject(url){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(Error('Компонент загрузки сейчас недоступен'));document.head.appendChild(s)})}
async function downloadBackup(){const own=(await recordAll()).filter(x=>x.source==='import');const data={type:'ATLAS_V2_BACKUP',state,books:own,at:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);notify('Книги и прогресс сохранены в файл')}
async function restoreBackup(f){try{const o=JSON.parse(await f.text());if(!o.state||!o.type?.startsWith('ATLAS_'))throw Error('Неизвестный формат копии');if(Array.isArray(o.books)){for(const b of o.books){if(b?.source==='import'&&b?.id&&Array.isArray(b.chapters))await recordPut(b)}customFiles=(await recordAll()).filter(b=>b.source==='import'&&Array.isArray(b.chapters)).map(({chapters,...meta})=>meta)}state={...state,...o.state};persist();notify('Книги и прогресс восстановлены');go('library')}catch(e){notify('Не получилось открыть резервную копию')}}
async function worldSearch(){if(!query.trim()){notify('Напиши название книги в поиске');return}modal('Мировой каталог',`<p>Ищем реальные библиографические записи в Open Library. Наличие книги в каталоге не даёт права на её полный текст.</p><div class="loading-dot"></div>`);try{const res=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=7&fields=key,title,author_name,first_publish_year`,{signal:AbortSignal.timeout(11000)});if(!res.ok)throw Error();const docs=(await res.json()).docs||[];modal('Найденные книги',`<p>${docs.length} записей Open Library:</p>${docs.map(b=>`<p style="border-bottom:1px solid var(--line);padding-bottom:11px"><b>${esc(b.title)}</b><br>${esc((b.author_name||[]).join(', '))}<br><a target="_blank" rel="noopener" class="source-link" href="https://openlibrary.org${esc(b.key)}">Открыть запись ↗</a></p>`).join('')}`)}catch{modal('Поиск недоступен','<p>Проверь интернет и попробуй ещё раз.</p>')}}
function showBook(id){const b=getBook(id);if(!b)return;focus=b;render();window.scrollTo(0,0)}
$('#app').addEventListener('click',async e=>{const node=e.target.closest('[data-open],[data-action],[data-cat],[data-mode],[data-prompt],[data-reader],[data-p],[data-word]');if(!node)return;
if(node.dataset.word&&reader){e.stopPropagation();dictionary(node.dataset.word);return}
if(node.hasAttribute('data-p')&&reader){const pos=+node.dataset.p;modal('Запомнить этот абзац?',`<p>При следующем открытии продолжим с выбранного абзаца:</p><div class="excerpt">${esc(chapterParas[pos]?.slice(0,250)||'')}</div>`,`<button class="btn" data-sheet="save-position" data-position="${pos}">Да, сохранить</button><button class="btn outline" data-sheet="close">Отмена</button>`);return}
if(node.dataset.open){showBook(node.dataset.open);return}
if(node.dataset.cat){filter=node.dataset.cat;render();return}
if(node.dataset.mode){mode=node.dataset.mode;render();return}
if(node.dataset.prompt){window.problemValue=node.dataset.prompt;recommendationWhy=suggestBooks(window.problemValue,'all');screen='advisor';focus=null;render();return}
if(node.dataset.reader){const a=node.dataset.reader;if(a==='exit')exitReader();else if(a==='next'||a==='prev')await loadChapter(chapter+(a==='next'?1:-1));else if(a==='settings')readerSettings();else if(a==='recap')recall();else if(a==='retry')loadChapter(chapter);return}
const a=node.dataset.action;if(!a)return;if(['home','catalog','advisor','library'].includes(a)){go(a);return}if(a==='back'){focus=null;render();return}if(a==='readable'){mode='readable';go('catalog');return}if(a==='resume'){const b=(state.recent||[]).map(getBook).find(Boolean);if(b)startReader(b);return}if(a==='start-reading'){await startReader(focus);return}if(a==='like'){const b=focus;state.likes=state.likes.includes(b.id)?state.likes.filter(i=>i!==b.id):[b.id,...state.likes];persist();render();notify(state.likes.includes(b.id)?'Сохранено в «Мои книги»':'Удалено из сохранённого');return}if(a==='upload'){$('#upload').click();return}if(a==='backup'){downloadBackup();return}if(a==='restore'){$('#restore').click();return}if(a==='recommend'){window.problemValue=$('#problem').value;recommendationWhy=suggestBooks(window.problemValue||'','all');render();return}if(a==='world-search'){worldSearch();return}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'){close();return}const node=e.target.closest('[data-sheet]');if(!node)return;const action=node.dataset.sheet;if(action==='close'){close();return}if(action==='continue'){close();loadChapter(state.progress[reader.id]?.chapter||0);return}if(action==='restart'){close();loadChapter(0);return}if(action==='save-position'){const p=+node.dataset.position;putProgress(reader,chapter,p,chapterParas.length);close();$$('[data-p]').forEach(x=>x.classList.toggle('focus',+x.dataset.p===p));notify('Закладка сохранена ✓');return}if(['bigger','smaller','sepia','white','night'].includes(action)){if(action==='bigger')state.fontSize=Math.min(28,state.fontSize+2);else if(action==='smaller')state.fontSize=Math.max(14,state.fontSize-2);else state.theme=action==='white'?'light':action==='night'?'night':'sepia';persist();close();if(reader&&chapterParas.length)renderChapter(reader,reader.source==='wikisource'?reader.sections[chapter].title:openBookCache.get(reader.id)[chapter].title,reader.source==='wikisource'?reader.sections.length:openBookCache.get(reader.id).length);return}});
$('#upload').addEventListener('change',e=>importFile(e.target.files?.[0]));$('#restore').addEventListener('change',e=>{if(e.target.files?.[0])restoreBackup(e.target.files[0])});
$('#app').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const box=$('#catalogResult');if(box)box.innerHTML=catalogResults(filterBooks())}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sheet').hidden)close();else if(reader)exitReader();else if(focus){focus=null;render()}}});
async function boot(){try{db=await openDB();customFiles=(await recordAll()).filter(b=>b.source==='import'&&Array.isArray(b.chapters)).map(({chapters,...rest})=>rest)}catch(e){console.warn('Local storage unavailable',e);notify('Файлы не смогут сохраняться на этом устройстве')}render()}
boot();
</script>
