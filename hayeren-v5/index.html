<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ec"><title>Hayeren — армянский с нуля</title><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body style="margin:0;background:#f7f3ec"><div id="loading" style="min-height:100dvh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#20352e"><div style="text-align:center"><div style="width:72px;height:72px;border-radius:24px;background:#446b5e;color:white;display:grid;place-items:center;font-size:38px;font-weight:800;margin:auto">Հ</div><p>Hayeren загружается…</p></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/edrubikovich001-ops/edrubikovich001-ops/adc93ca414a9a3eceb9b1effe33bbc794e5f072b/hayeren-v5/';const parts=await Promise.all(Array.from({length:13},(_,i)=>fetch(base+'part'+String(i).padStart(2,'0')+'.txt',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('part '+i);return r.text()})));const binary=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#20352e"><h2>Hayeren</h2><p>Не удалось загрузить обновление. Закройте Mini App и откройте его снова.</p></div>'}})();</script></body></html>
