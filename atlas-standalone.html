/* ATLAS 4 / Reader-first experience: clear navigation and rested eyes */

const storedCoverIds=(()=>{try{return JSON.parse(localStorage.getItem('atlas-cover-ids-v3')||'{}')}catch{return {}}})();

const coverUrl = b => b.userCover || embeddedCovers[b.id] || russianEditionCovers[b.id] || (curatedCoverIds[b.id] ? `https://covers.openlibrary.org/b/id/${curatedCoverIds[b.id]}-M.jpg?default=false` : b.isbn||editionISBN[b.id] ? `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(b.isbn||editionISBN[b.id])}-M.jpg?default=false` : storedCoverIds[b.id]?`https://covers.openlibrary.org/b/id/${storedCoverIds[b.id]}-M.jpg?default=false`:'');
function cover(b){const [bg,fg]=themes[(b.index||0)%themes.length];const title=esc(b.title),author=esc(b.author),long=b.title.length>35?'long':'';const image=coverUrl(b);return `<div class="book-cover ${long}" style="--b1:${bg};--b2:${fg}" lang="${b.lang||'ru'}" ${!image?`data-find-cover="${esc(b.id)}"`:''}>${image?`<img loading="lazy" decoding="async" class="cover-photo" src="${esc(image)}" alt="Обложка существующего издания книги ${title}" onerror="coverFailure(this,'${esc(b.id)}')">`:''}<span class="cover-author">${author}</span><i class="cover-rule"></i><strong class="cover-title">${title}</strong><span class="cover-foot">Без обложки · ${icon(b)}</span></div>`}
function card(b){const has=readable(b);return `<div class="card-wrap"><div class="book-card" data-open="${esc(b.id)}" role="button" tabindex="0" aria-label="О книге ${esc(b.title)}">${cover(b)}<div class="book-card-title">${esc(b.title)}</div><div class="book-card-author">${esc(b.author)}</div></div><button class="book-fast ${has?'ready':''}" data-quick-read="${esc(b.id)}">${has?(state.progress?.[b.id]?'Продолжить чтение →':'Читать сейчас →'):officialPreview[b.id]?'Читать фрагмент ↗':'Описание книги →'}</button></div>`}
function list(b){const pct=state.progress?.[b.id]?.percent||0;return `<div class="browse-row" data-open="${esc(b.id)}" role="button" tabindex="0">${cover(b)}<div class="row-info"><h3>${esc(b.title)}</h3><p>${esc(b.author)} · ${esc(b.category)}</p><span class="book-status ${!readable(b)?'catalog-status':''}">${pct?`Продолжить · ${pct}%`:readable(b)?'Читать оригинал':'Описание и источник'}</span></div><span style="color:#739182;align-self:center;font-size:18px">›</span></div>`}
function section(title,action,text,books){return `<section class="section"><div class="section-head"><h2>${title}</h2>${action?`<button class="inline-link" data-action="${action}">${text||'Все книги'} →</button>`:''}</div><div class="row-scroll">${books.map(card).join('')}</div></section>`}
const pict={home:'<path d="m3 11 9-7 9 7v9h-6v-6H9v6H3z"/>',catalog:'<path d="M4 4h16v16H4zM9 4v16M9 8h11M9 12h11"/>',advisor:'<path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7z"/>',library:'<path d="M4 4h16v16H4zM8 4v16M12 4v16M16 4v16"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>'};

function header(){return `<header class="header"><div class="brand" data-action="home"><span class="brand-symbol">A<span class="brand-star">✦</span></span><div class="brand-label">ATLAS <span>ТВОЯ БИБЛИОТЕКА</span></div></div><div class="header-side"><button class="mini-icon theme-header-button" aria-label="Изменить тему ATLAS" title="Выбрать светлую, яркую или ночную тему" data-action="ui-theme">◐</button><button class="mini-icon" aria-label="Как пользоваться" data-action="help">?</button><button class="mini-icon" aria-label="Поиск книг" data-action="catalog">${pictSvg('search')}</button></div></header>`}
function nav(){return `<nav class="navbar" aria-label="Навигация">${[['home','Главная'],['catalog','Читать'],['advisor','Подбор'],['library','Мои книги']].map(([id,label])=>`<button class="${screen===id?'active':''}" data-action="${id}" aria-label="${label}"><span>${pictSvg(id)}</span>${label}</button>`).join('')}</nav>`}
function starterBook(){const i=state.interest||'';if(i==='Истории' || i==='Детективы')return getBook('real-captain');if(i==='Философия' || i==='Саморазвитие' || i==='Психология')return getBook('real-marcus');return getBook((state.persona==='young')?'real-captain':'real-marcus')}
function home(){const current=(state.recent||[]).map(getBook).find(Boolean);const pc=current?state.progress[current.id]:null;const first=starterBook();const picks=sourceBooks.filter(x=>x.lang==='ru');const subtitle=state.interest?`Подобрали книги по интересу «${esc(state.interest)}».`:'Выбери произведение — и читай настоящий текст прямо здесь.';return `<div class="page">${header()}<div class="hero"><div class="eyebrow">МЕСТО, ГДЕ ПРИЯТНО ЧИТАТЬ</div><h1>Твоя следующая<br><em>любимая книга.</em></h1><p class="hero-desc">Найди историю или идею. Открой книгу в одно касание. ATLAS запомнит место, где ты остановился.</p></div>${current?`<div class="resume-card" data-action="resume"><span class="resume-icon">▶</span><div><b>Продолжить чтение</b><p>${esc(current.title)}</p></div><span class="percent">${pc?.percent||0}% →</span></div>`:`<div class="hero-start"><span class="eyebrow">НАЧНИ С ЭТОГО</span><h2>${esc(first.title)}</h2><p>${esc(first.author)} · оригинальный текст доступен сейчас, без загрузки файлов.</p><button class="btn" data-quick-read="${esc(first.id)}">▶ Читать первую книгу</button></div>`}<div class="home-shortcuts"><button data-action="readable"><span>▤</span>Выбрать книгу<small>Полные тексты внутри</small></button><button data-action="advisor"><span>✧</span>Подобрать под себя<small>По цели или возрасту</small></button></div><div class="tip-strip"><span>Не знаешь, что нажать? Есть короткая инструкция.</span><button data-action="help">Показать →</button></div>${section('Открыть и читать','readable','Все тексты',picks)}<p class="section-sub">${subtitle}</p>${section('Легендарные книги','catalog','Весь каталог',[raw[0],raw[2],raw[3],raw[4],raw[5],raw[6],raw[10]].filter(Boolean))}<p class="copyright-note">Полные тексты классики — из открытых источников. Современные книги — описания, ознакомительные фрагменты и твои законно приобретённые файлы.</p></div>`}
const categories=['Все','Психология','Саморазвитие','Философия','Бизнес','Влияние','Художественная','Наука','Финансы','История','Фантастика','Для подростков'];

function catalogPage(){const books=filterBooks();return `<div class="page">${header()}<div class="catalog-head"><span class="eyebrow">КАТАЛОГ</span><h1>Выбери книгу</h1><p>Во вкладке «Читать сейчас» все книги открываются внутри ATLAS. Во «Всём каталоге» есть и современные издания — не все доступны целиком.</p></div><div class="searchfield"><span>${pictSvg('search')}</span><input id="search" value="${esc(query)}" placeholder="Поиск по названию, автору, теме" autocomplete="off" aria-label="Поиск книг"></div><div class="tabs"><button data-mode="readable" class="${mode==='readable'?'active':''}">◉ Читать сейчас</button><button data-mode="all" class="${mode==='all'?'active':''}">Весь каталог · ${all().length}</button></div><div class="category-scroll">${categories.map(c=>`<button class="${filter===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="catalogResult">${catalogResults(books)}</div></div>`}

function cleanWikitext(html){const d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('style,script,table,.mw-editsection,.references,.reference,.noprint,.mw-collapsible,.ws-noexport,.pagenum,.pagequality,.poem .mw-editsection').forEach(e=>e.remove());const root=d.querySelector('.mw-parser-output')||d.body;

async function getPage(b,n){const k=`atlas-text-${b.id}-${n}`;const stored=await recordGet(k);if(stored?.paras?.length)return stored.paras;const sec=b.sections[n];if(!sec)throw Error('Глава не найдена');const url=`https://ru.wikisource.org/w/api.php?action=parse&prop=text&format=json&origin=*&page=${encodeURIComponent(sec.page)}`;let obj;try{const resp=await fetch(url,{signal:AbortSignal.timeout(13000)});if(!resp.ok)throw Error(`HTTP ${resp.status}`);obj=await resp.json()}catch(err){const fallback=await fetch(`${proxy}?source=wiki&page=${encodeURIComponent(sec.page)}`,{signal:AbortSignal.timeout(17000)});if(!fallback.ok)throw Error('Викитека сейчас недоступна — проверь интернет');obj=await fallback.json()}

async function importFile(file){if(!file)return;if(file.size>30e6){notify('Файл должен быть меньше 30 МБ');return}notify('Читаем файл…');try{const ext=file.name.split('.').at(-1).toLowerCase();let text='';if(ext==='txt')text=await file.text();else if(ext==='fb2'){const xml=new DOMParser().parseFromString(await file.text(),'text/xml');if(xml.querySelector('parsererror'))throw Error('Неверный FB2');text=[...xml.querySelectorAll('body p,body subtitle,body title')].map(n=>n.textContent.trim()).filter(Boolean).join('\n\n')}else if(ext==='epub'){if(!window.JSZip)await inject('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');const zip=await JSZip.loadAsync(file);const container=zip.file('META-INF/container.xml');if(!container)throw Error('EPUB повреждён');const data=new DOMParser().parseFromString(await container.async('text'),'application/xml');const opf=data.querySelector('rootfile')?.getAttribute('full-path');if(!opf)throw Error('EPUB без содержания');const xml=new DOMParser().parseFromString(await zip.file(opf).async('text'),'application/xml');const manifest={};[...xml.getElementsByTagName('item')].forEach(x=>manifest[x.getAttribute('id')]=x.getAttribute('href'));const spine=[...xml.getElementsByTagName('itemref')].map(x=>x.getAttribute('idref'));const dir=opf.includes('/')?opf.slice(0,opf.lastIndexOf('/')+1):'';let paras=[];for(const ref of spine){const f=zip.file(dir+decodeURIComponent(manifest[ref]||'').replace(/^\.\//,''));if(!f)continue;const h=new DOMParser().parseFromString(await f.async('text'),'text/html');paras.push(...[...h.querySelectorAll('p,h1,h2,h3,li')].map(x=>x.textContent.trim()).filter(Boolean))}text=paras.join('\n\n')}else if(ext==='pdf'){if(!window.pdfjsLib)await inject('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let pages=[];for(let i=1;i<=pdf.numPages;i++)pages.push((await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(' '));text=pages.join('\n\n')}else throw Error('Формат не поддерживается');if(text.trim().length<100)throw Error('В файле не нашёлся текст. Сканированные PDF не поддерживаются.');const chapters=groupChapters(splitParas(text));const id='mine-'+crypto.randomUUID();const meta={id,title:file.name.replace(/\.[^.]+$/,''),author:'Мой файл',category:'Мои книги',lang:'ru',age:12,source:'import',index:96,desc:`Мой полный оригинальный текст: ${file.name}`,chapters:chapters.length};await recordPut({...meta,chapters});customFiles.unshift(meta);notify('Книга готова к чтению');focus=meta;screen='library';render()}catch(e){modal('Не получилось открыть файл',`<p>${esc(e.message||'Попробуй другой файл')}</p>`)}finally{$('#upload').value=''}}
function inject(url){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(Error('Компонент загрузки сейчас недоступен'));document.head.appendChild(s)})}

/* ATLAS 5 — theme preference and encrypted cross-device progress sync. */
const CLOUD_ENDPOINT = 'https://wxurfzmcghwvrcadnvjl.supabase.co/functions/v1/atlas-sync';
const CLOUD_KEY_NAME = 'atlas-secure-sync-key-v1-'+uid;
let cloudRunning = false, cloudTimer = null, lastCloudSync = 0;
const getCloudCode = () => { try { return localStorage.getItem(CLOUD_KEY_NAME)||''; }catch{return '';} };
const encoder = new TextEncoder(), decoder = new TextDecoder();
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function bytesFromB64(s){if(!/^[A-Za-z0-9_-]+$/.test(s))throw Error('Неверный код');const a=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));return Uint8Array.from(a,c=>c.charCodeAt(0))}
function readCloudKey(code){const raw=bytesFromB64(code);if(raw.length!==32)throw Error('Неверная длина кода');return raw}
async function cloudIdentity(code){const raw=readCloudKey(code);const idbytes=await crypto.subtle.digest('SHA-256',encoder.encode('atlas-sync-v1:'+code));const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);return {id:[...new Uint8Array(idbytes)].map(x=>x.toString(16).padStart(2,'0')).join(''),key}}
function cloudSnapshot(){return {schema:1,progress:state.progress||{},likes:state.likes||[],recent:state.recent||[],uiTheme:state.uiTheme||'dark',theme:state.theme||'sepia',fontSize:state.fontSize||19,uiUpdatedAt:state.uiUpdatedAt||0,interest:state.interest||'',persona:state.persona||'all'}}
async function encryptSnapshot(cryptKey){const iv=crypto.getRandomValues(new Uint8Array(12));const data=encoder.encode(JSON.stringify(cloudSnapshot()));const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptKey,data);return JSON.stringify({v:1,iv:b64url(iv),data:b64url(new Uint8Array(ciphertext))})}
async function decryptSnapshot(cryptKey,payload){const o=JSON.parse(payload);if(o.v!==1)throw Error('Неизвестный формат облачных данных');const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytesFromB64(o.iv)},cryptKey,bytesFromB64(o.data));const snapshot=JSON.parse(decoder.decode(data));if(snapshot.schema!==1||!snapshot.progress||!Array.isArray(snapshot.likes))throw Error('Неверные облачные данные');return snapshot}
async function cloudRequest(action,id,payload){const response=await fetch(CLOUD_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,id,payload}),signal:AbortSignal.timeout(16000),cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Облачный сервер недоступен');return data}
function mergeCloudSnapshot(remote){const local=state.progress||{},online=remote.progress||{},merged={...local};
  for(const [id,p] of Object.entries(online)){if(!p||typeof p!=='object'||!/^[-_\w]+$/.test(id))continue;if(!merged[id]||Number(p.at||0)>Number(merged[id].at||0))merged[id]=p}
  state.progress=merged;state.recent=[...new Set([...(state.recent||[]),...(remote.recent||[])])].filter(x=>typeof x==='string').sort((a,b)=>Number(merged[b]?.at||0)-Number(merged[a]?.at||0)).slice(0,24);
  state.likes=[...new Set([...(state.likes||[]),...(remote.likes||[])])].filter(x=>typeof x==='string').slice(0,300);
  if(Number(remote.uiUpdatedAt||0)>Number(state.uiUpdatedAt||0)){state.uiTheme=['dark','light','bright'].includes(remote.uiTheme)?remote.uiTheme:'dark';state.theme=remote.theme||state.theme;state.fontSize=Number(remote.fontSize)||state.fontSize;state.uiUpdatedAt=remote.uiUpdatedAt;applyUITheme(state.uiTheme)}
  if(!state.interest&&remote.interest)state.interest=remote.interest;
  if((!state.persona||state.persona==='all')&&remote.persona)state.persona=remote.persona;
  try{localStorage.setItem(key,JSON.stringify(state))}catch{}
}
async function syncNow(opts={}){const secret=opts.code||getCloudCode();if(!secret||cloudRunning)return false;cloudRunning=true;
 try{const {id,key:cryptKey}=await cloudIdentity(secret);const remote=await cloudRequest('pull',id);if(opts.mustExist&&!remote.exists)throw Error('Такого кода в облаке нет. Проверь, что он скопирован с первого устройства.');
  if(remote.exists)mergeCloudSnapshot(await decryptSnapshot(cryptKey,remote.payload));
  await cloudRequest('push',id,await encryptSnapshot(cryptKey));lastCloudSync=Date.now();
  if(!opts.silent){notify('Закладки и прогресс синхронизированы ✓');if(!reader)render()}
  return true;
 }catch(e){if(!opts.silent)notify('Ошибка облака: '+String(e?.message||e).slice(0,90));return false}finally{cloudRunning=false}
}
function scheduleCloudSync(){if(!getCloudCode()||cloudRunning)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{void syncNow({silent:true})},2300)}
function applyUITheme(theme){const choice=['dark','light','bright'].includes(theme)?theme:'dark';document.documentElement.dataset.uiTheme=choice;
 const meta=document.querySelector('meta[name="theme-color"]');const bg=choice==='light'?'#f6f4ef':choice==='bright'?'#fbf8ff':'#101722';if(meta)meta.content=bg;
 try{TG?.setHeaderColor?.(bg);TG?.setBackgroundColor?.(bg)}catch{}
}
function setUITheme(theme){if(!['dark','light','bright'].includes(theme))return;state.uiTheme=theme;state.uiUpdatedAt=Date.now();applyUITheme(theme);persist();if(reader){showThemeSettings();return}render();showThemeSettings()}
function themePicker(){return `<div class="theme-picker" role="group" aria-label="Тема приложения">${[
 ['dark','Ночная','night','Спокойная'],['light','Светлая','paper','Как бумага'],['bright','Яркая','pop','Больше красок']
 ].map(([id,title,css,desc])=>`<button class="theme-opt" data-sheet="ui-${id}" aria-pressed="${state.uiTheme===id?'true':'false'}"><span class="theme-sample ${css}"></span>${title}<span class="theme-chip">${desc}</span></button>`).join('')}</div>`}
function showThemeSettings(){modal('Тема ATLAS',`<p>Выбери стиль всей библиотеки. Он сохранится и при следующем открытии.</p>${themePicker()}<p>Цвет самой страницы книги можно выбрать отдельно в настройках чтения.</p>`,`<button class="btn" data-sheet="close">Готово ✓</button>`)}
function showCloudSettings(){const connected=!!getCloudCode();const stamp=lastCloudSync?new Date(lastCloudSync).toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'пока не проверено';
  const content=connected?`<p>Облако подключено. Прогресс и избранные книги автоматически синхронизируются, когда есть интернет.</p><p class="cloud-status">Последняя синхронизация: ${stamp}</p><div class="cloud-actions"><button class="btn" data-sheet="cloud-sync">⟳ Синхронизировать сейчас</button><button class="btn light" data-sheet="cloud-show">◉ Мой код подключения</button><button class="btn outline" data-sheet="cloud-disconnect">Отключить облако на устройстве</button></div>`:
  `<p>Новый телефон или браузер? Перенеси закладки и место чтения по одному защищённому коду, без регистрации.</p><div class="cloud-actions"><button class="btn" data-sheet="cloud-create">☁ Включить облако</button><button class="btn light" data-sheet="cloud-connect">У меня уже есть код</button></div>`;
  modal('Моя синхронизация',content+`<p class="cloud-help" style="margin-top:16px">🔒 Данные зашифрованы на твоём устройстве. Облако хранит только закладки, прогресс и настройки — сами загруженные EPUB и PDF остаются на устройстве. Не передавай код посторонним.</p>`,`<button class="btn outline" data-sheet="close">Закрыть</button>`)
}
function showCloudCode(){const code=getCloudCode();if(!code)return showCloudSettings();modal('Код для второго устройства',`<p>На втором устройстве открой ATLAS → «Мои книги» → «Облако» → «У меня уже есть код».</p><div class="cloud-code" id="cloud-code-display">${esc(code)}</div><p class="cloud-help">Код секретный: любой, у кого он есть, сможет подключить твои закладки.</p>`,`<button class="btn" data-sheet="cloud-copy">Скопировать код</button><button class="btn outline" data-sheet="close">Готово</button>`)}
async function copyCloudCode(){const code=getCloudCode();if(!code)return;try{await navigator.clipboard.writeText(code);notify('Код скопирован ✓')}catch{const x=document.createElement('textarea');x.value=code;document.body.append(x);x.select();try{document.execCommand('copy');notify('Код скопирован ✓')}catch{notify('Выдели код и скопируй вручную')}x.remove()}}
async function createCloud(){if(!crypto.subtle){notify('На этом устройстве недоступно шифрование');return}const code=b64url(crypto.getRandomValues(new Uint8Array(32)));try{localStorage.setItem(CLOUD_KEY_NAME,code)}catch{notify('Не удалось сохранить код на устройстве');return}close();const ok=await syncNow({code});if(ok)showCloudCode();else {try{localStorage.removeItem(CLOUD_KEY_NAME)}catch{}showCloudSettings()}}
function cloudConnectPrompt(){modal('Подключить облако',`<p>Вставь код, созданный на первом устройстве. Прогресс объединится — начатые книги не пропадут.</p><input id="cloud-input" class="cloud-field" type="text" spellcheck="false" autocapitalize="none" autocomplete="off" placeholder="Вставь код из ATLAS" aria-label="Код облачной библиотеки" />`,`<button class="btn" data-sheet="cloud-link">Подключить</button><button class="btn outline" data-sheet="cloud-settings">Назад</button>`)}
async function connectCloud(){const code=String($('#cloud-input')?.value||'').replace(/\s+/g,'');try{readCloudKey(code)}catch{notify('Проверь код — он должен быть целиком');return}const previous=getCloudCode();close();const ok=await syncNow({code,mustExist:true});if(ok){localStorage.setItem(CLOUD_KEY_NAME,code);showCloudSettings()}else {if(previous)localStorage.setItem(CLOUD_KEY_NAME,previous);cloudConnectPrompt()}}
function disconnectCloud(){try{localStorage.removeItem(CLOUD_KEY_NAME)}catch{}clearTimeout(cloudTimer);lastCloudSync=0;showCloudSettings();notify('Автоматическая синхронизация отключена')}

const WELCOME_KEY='atlas-welcome-v4-'+uid;
function welcomeView(){const root=$('#welcome');root.hidden=false;const steps=`<div class="welcome-dots">${[0,1,2].map(i=>`<span class="${i===welcomeStep?'active':''}"></span>`).join('')}</div>`;
 if(welcomeStep===0)root.innerHTML=`<section class="welcome-panel" role="dialog" aria-modal="true" aria-label="Знакомство с ATLAS"><div class="welcome-steps">ATLAS • ТВОЯ БИБЛИОТЕКА</div><div class="welcome-logo">A</div><h2>Книги без лишних шагов.</h2><p>Всего три простых действия — и ты уже читаешь.</p><div class="welcome-road"><div><b>1</b> Выбери книгу по интересам</div><div><b>2</b> Нажми «Читать сейчас»</div><div><b>3</b> Продолжай с сохранённого места</div></div>${steps}<button class="btn" data-welcome="next">Начать →</button><button class="welcome-skip" data-welcome="skip">Пропустить знакомство</button></section>`;
 else if(welcomeStep===1)root.innerHTML=`<section class="welcome-panel" role="dialog" aria-modal="true"><div class="welcome-steps">ШАГ 1 ИЗ 2</div><h2>Для кого подбирать книги?</h2><p>Это только рекомендации. В каталоге по-прежнему доступны все возрастные категории.</p><div class="welcome-options">${[['young','12–15 лет'],['teen','16–22 года'],['adult','Взрослый'],['all','Без ограничений']].map(([v,n])=>`<button class="${welcomeAge===v?'selected':''}" data-age="${v}">${n}</button>`).join('')}</div>${steps}<button class="btn" data-welcome="next">Дальше →</button><button class="welcome-skip" data-welcome="back">← Назад</button></section>`;
 else root.innerHTML=`<section class="welcome-panel" role="dialog" aria-modal="true"><div class="welcome-steps">ШАГ 2 ИЗ 2</div><h2>Что тебе интересно?</h2><p>Выбери направление. Его можно изменить в любой момент.</p><div class="welcome-options">${['Истории','Философия','Психология','Саморазвитие','Детективы','Бизнес'].map(v=>`<button class="${welcomeInterest===v?'selected':''}" data-interest="${v}">${v}</button>`).join('')}</div>${steps}<button class="btn" data-welcome="done">Показать книги →</button><button class="welcome-skip" data-welcome="back">← Назад</button></section>`;
}
$('#welcome').addEventListener('click',e=>{const age=e.target.closest('[data-age]');const intr=e.target.closest('[data-interest]');const step=e.target.closest('[data-welcome]');if(age){welcomeAge=age.dataset.age;welcomeView();return}if(intr){welcomeInterest=intr.dataset.interest;welcomeView();return}if(!step)return;const action=step.dataset.welcome;if(action==='next'){welcomeStep=Math.min(2,welcomeStep+1);welcomeView()}else if(action==='back'){welcomeStep=Math.max(0,welcomeStep-1);welcomeView()}else if(action==='done'||action==='skip'){if(action==='done'){state.persona=welcomeAge;state.interest=welcomeInterest;persist()}try{localStorage.setItem(WELCOME_KEY,'yes')}catch{}$('#welcome').hidden=true;welcomeStep=0;screen='home';focus=null;render();window.scrollTo(0,0)}});
function showWelcome(){welcomeStep=0;welcomeView()}
async function boot(){try{db=await openDB();customFiles=(await recordAll()).filter(b=>b.source==='import'&&Array.isArray(b.chapters)).map(({chapters,...rest})=>rest)}catch(e){console.warn('Local storage unavailable',e);notify('Файлы не смогут сохраняться на этом устройстве')}applyUITheme(state.uiTheme);render();try{if(localStorage.getItem(WELCOME_KEY)!=='yes')showWelcome()}catch{showWelcome()}if(getCloudCode())void syncNow({silent:true})}
boot();
</script>
</body></html>
