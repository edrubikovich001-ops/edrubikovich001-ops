name: Hayeren keep warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Hayeren
        run: |
          curl -sS --max-time 25 'https://hayeren-v9-live.onrender.com/?keepwarm=1' >/dev/null || true
          sleep 2
          curl -sS --max-time 25 'https://hayeren-v9-live.onrender.com/?keepwarm=2' >/dev/null || true
